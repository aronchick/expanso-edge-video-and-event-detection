version = 1

[repository]
name = "demo-drone-detection"
published = true

[web]
document = "public/guide/index.html"
explanation_selector = "#explanation"
explorer_selector = "#explorer"
run_selector = "#run"
deploy_selector = "#deploy"

[browser]
url = "http://127.0.0.1:18281/guide/"
ready_url = "http://127.0.0.1:18281/guide/"
start_command = ["python3", "scripts/serve-guide.py"]
stop_command = ["python3", "scripts/serve-guide.py", "--stop"]
theme_toggle_selector = "#theme-toggle"
stage_selector = "[data-stage-id]"
current_stage_selector = "[data-stage-id][aria-current='step']"
scroll_anchor_selector = "#explorer"
json_selectors = ["[data-public-json]"]

[[browser.controls]]
id = "copy-stage-yaml"
kind = "copy"
selector = "#copy-stage-yaml"
feedback_selector = "#copy-yaml-status"
success_text = "Copied"
failure_text = "Copy failed"

[[browser.controls]]
id = "copy-stage-output"
kind = "copy"
selector = "#copy-stage-output"
feedback_selector = "#copy-output-status"
success_text = "Copied"
failure_text = "Copy failed"

[[browser.controls]]
id = "download-stage-output"
kind = "download"
selector = "#download-stage-output"
feedback_selector = "#download-output-status"
success_text = "Downloaded"
failure_text = "Download failed"
failure_url_pattern = "**/data/stages/**"

[[browser.controls]]
id = "copy-run-install"
kind = "copy"
selector = "#copy-run-install"
feedback_selector = "#feedback-run-install"
success_text = "Copied"
failure_text = "Copy failed"

[[browser.controls]]
id = "copy-deploy-jobs"
kind = "copy"
selector = "#copy-dep-jobs"
feedback_selector = "#feedback-dep-jobs"
success_text = "Copied"
failure_text = "Copy failed"

[[browser.controls]]
id = "download-job"
kind = "download"
selector = "#download-job"
feedback_selector = "#download-job-status"
success_text = "Downloaded"
failure_text = "Download failed"
failure_url_pattern = "**/data/jobs/**"

