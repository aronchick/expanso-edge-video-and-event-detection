# armyx-tech edge ISR — S3 archive pipeline (Pure Bloblang).
#
# Tails the orchestrator's events.ndjson on the Jetson and ships every signed
# sensor event to s3://armyx-tech-edge-events-767397752906/events/.
#
# Why this is the demo's centerpiece:
#   1. When the Jetson is connected: events flow through here to S3 within
#      seconds. The dashboard's "Cloud Egress" tile shows the count climbing
#      in lockstep with what `aws s3 ls` reports.
#   2. When the Jetson disconnects from cloud.expanso.io (operator hits F1):
#      the pipeline keeps consuming events.ndjson but cannot reach S3.
#      Expanso Edge's offline buffer at /var/lib/expanso retains every event
#      durably. Dashboard shows "blobs queued at edge".
#   3. When reconnected (F2): the buffer drains. S3 object count surges.
#
# Bloblang dialect notes for this Expanso Edge build:
#   - `now()` works but its return value has no chained methods (no
#     `.ts_format(...)`, `.format_timestamp(...)`, `.string()`).  It returns
#     an ISO 8601 / RFC 3339 string by default — perfect for sortable keys.
#   - `env(...)` is NOT available — bucket name is hardcoded.
#   - String/numeric methods like `"%v-%v".format(timestamp_unix(), batch_index())`
#     do work — that's how we'd compose if `now()` were unusable.
#   - `uuid_v4()` works.
#
# Deploy:
#   expanso-cli profile select armyx-tech
#   expanso-cli job deploy jobs/armyx-tech-event-archive.yaml

name: armyx-tech-event-archive
type: pipeline

config:
  input:
    # `file` input scan-and-exits, which makes the job land in `completed`
    # state after one drain. We need a long-running tail. `subprocess`
    # input runs an external command and treats each stdout line as a
    # message — pairing it with `tail -F` gives us a stream that follows
    # rotations and survives the file being recreated by the
    # orchestrator process. Same pattern as the sensor jobs use.
    subprocess:
      # Force line-buffered output. Without `stdbuf -oL`, tail's stdout
      # is block-buffered when piped (default ~4KB buffer) — bento sees
      # zero messages until the buffer fills, which at our event size
      # takes minutes. With -oL, every line flushes immediately so
      # bento processes events as they land.
      name: /usr/bin/stdbuf
      args:
        - -oL
        - /usr/bin/tail
        - -F
        - -n
        - "+1"
        - /opt/edge-isr/orchestrator/events.ndjson
      codec: lines
      restart_on_exit: true
      max_buffer: 1048576

  pipeline:
    processors:
      # Bare minimum — let messages through unchanged. Anything fancier
      # was eating messages silently in this Expanso build.
      - mapping: root = content().string()

  output:
    broker:
      pattern: fan_out
      outputs:
        # Primary sink: S3.  Key path puts the ISO-8601 timestamp first so a
        # plain `aws s3 ls --recursive` sorts chronologically; uuid_v4 tail
        # guarantees uniqueness when multiple events arrive in the same second.
        - aws_s3:
            bucket: armyx-tech-edge-events-767397752906
            region: us-west-2
            # Explicit profile — the Jetson's ~/.aws/credentials has only
            # [armyx-tech] (no [default]) so without this, the AWS SDK
            # fails auth silently and bento drops every message at the
            # s3 sink. AWS_PROFILE env var would also work but the agent
            # subprocess env isn't reliably set, so we hardcode here.
            credentials:
              profile: armyx-tech
            path: 'events/${! this.node.or("unknown") }/${! now() }-${! uuid_v4() }.json'
            content_type: application/json
            batching:
              count: 25
              period: 2s
        # Belt-and-suspenders local archive: even if AWS creds are misconfigured
        # in the field, the local NDJSON keeps growing. This is also what we
        # tail for `expanso-cli job logs` during the demo so judges see the
        # platform doing real work.
        - file:
            path: /opt/edge-isr/archive/events.ndjson
            codec: lines
        - stdout:
            codec: lines
