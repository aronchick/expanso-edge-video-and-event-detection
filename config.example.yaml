# Security Camera Box Counting Demo — Configuration
# ================================================
#
# Environment variables are expanded using ${VAR} or ${VAR:default} syntax.
# Set these before running:
#
#   export CAM_USER=admin
#   export CAM_PASS_OUTSIDE=yourpassword
#   export CAM_PASS_INSIDE=yourpassword
#   export CAM_IP_OUTSIDE=192.168.1.172
#   export CAM_IP_INSIDE=192.168.1.15
#
# Or create a .env file and source it:
#   source .env && uv run esc-infer config.yaml

device_id: "${DEVICE_ID:recomputer-j3011-001}"
site_id: "${SITE_ID:warehouse-demo}"

# Detection mode: "box" or "person"
detect_mode: "box"

# Model configuration
model_name: "yolov8s"
model_precision: "fp16"
confidence_threshold: 0.3

# For person counting, uncomment:
# detect_mode: "person"
# detect_classes: [0]  # COCO class 0 = person

# Class mapping: YOLO's COCO class -> display name
class_map:
  suitcase: "box"
  backpack: "box"
  handbag: "box"
  sports ball: "box"
  bottle: "box"
  cup: "box"
  cell phone: "box"

# Cameras — IPs and credentials from environment variables
cameras:
  - camera_id: "cam-outside"
    url: "rtsp://${CAM_USER:admin}:${CAM_PASS_OUTSIDE}@${CAM_IP_OUTSIDE}:554/h264Preview_01_sub"
    counting_line_y: 180
    counting_line_x_start: 20
    counting_line_x_end: 620
    count_direction: "down"
    direction_filter: "right"
    role: "outside"

  - camera_id: "cam-inside"
    url: "rtsp://${CAM_USER:admin}:${CAM_PASS_INSIDE}@${CAM_IP_INSIDE}:554/h264Preview_01_sub"
    counting_line_y: 180
    counting_line_x_start: 20
    counting_line_x_end: 620
    count_direction: "down"
    direction_filter: "left"
    role: "inside"

# Counting parameters
cooldown_seconds: 3.0
size_filter_min_area: 1500
size_filter_max_area: 200000
size_filter_min_width: 30

# Inference
inference_interval: 1  # process every frame

# File paths
state_path: "state.json"
commands_path: "commands.json"
