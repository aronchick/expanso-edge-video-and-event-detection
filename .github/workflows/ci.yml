name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, tests, generated guide
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra test --frozen

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Format
        run: uv run --frozen ruff format --check .

      - name: Tests
        run: uv run --frozen pytest

      - name: Shell scripts parse
        run: |
          for script in scripts/*.sh proof/*.sh; do
            bash -n "$script"
          done

      - name: The guide matches the fixtures
        run: uv run -s scripts/build-guide.py --check

      - name: Workflows are valid
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint:1.7.7 -color

  s3-proof:
    name: Archive writes to S3 over TLS
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.17"

      - name: Prove the S3 output against a TLS, authenticated service
        run: uv run -s scripts/prove-s3.py --require --report artifacts/s3-proof.json

      - name: Upload the proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s3-proof
          path: artifacts/s3-proof.json
          if-no-files-found: warn
          retention-days: 30
