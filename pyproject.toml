[project]
name = "expanso-security-camera"
version = "0.1.0"
description = "Edge video analytics for box counting and discrepancy detection"
requires-python = ">=3.11"
dependencies = [
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "boto3>=1.34.0",
    "wsproto>=1.2.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
esc-infer = "expanso_security_camera.inference:main"
esc-record = "expanso_security_camera.recorder:main"
esc-server = "expanso_security_camera.server:main"
esc-simulate = "expanso_security_camera.simulate:main"
esc-test-cameras = "expanso_security_camera.test_cameras:main"
esc-diagnose = "expanso_security_camera.diagnose:main"
esc-dataset = "expanso_security_camera.dataset:main"
esc-finetune = "expanso_security_camera.finetune:main"
edge-sensor = "expanso_security_camera.sensor.main:main"
edge-orchestrator = "expanso_security_camera.orchestrator.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/expanso_security_camera"]

# The dashboards ship inside the wheel so `uv run --from git+...` serves them.
[tool.hatch.build.targets.wheel.force-include]
"public" = "expanso_security_camera/public"

[project.optional-dependencies]
# Live detection: the YOLO weights run through these. The orchestrator, the
# replay sensor, the fuse correlator and the tests do not need them.
vision = [
    "ultralytics>=8.1.0",
    "lapx>=0.5.0",
    "clip @ git+https://github.com/ultralytics/CLIP.git",
]
test = [
    "ruff>=0.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
# The vendored public-bar checker is verified by digest; never reformat it.
extend-exclude = [".demo-kit"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
# The guide builder holds the page prose and HTML template as long strings.
"scripts/build-guide.py" = ["E501"]

[dependency-groups]
dev = [
    "playwright>=1.48.0",
]
