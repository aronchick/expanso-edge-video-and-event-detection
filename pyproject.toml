[project]
name = "expanso-security-camera"
version = "0.1.0"
description = "Edge video analytics for box counting and discrepancy detection"
requires-python = ">=3.8"
dependencies = [
    "ultralytics>=8.1.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "lapx>=0.5.0",
    "clip @ git+https://github.com/ultralytics/CLIP.git",
]

[project.scripts]
esc-infer = "expanso_security_camera.inference:main"
esc-record = "expanso_security_camera.recorder:main"
esc-server = "expanso_security_camera.server:main"
esc-simulate = "expanso_security_camera.simulate:main"
esc-test-cameras = "expanso_security_camera.test_cameras:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/expanso_security_camera"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
