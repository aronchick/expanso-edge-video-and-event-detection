# dnsmasq config for the demo tunnel.
# Runs as a per-project user process on 127.0.0.1:5354.
# Returns 127.0.0.1 for any *.us2.cloud.expanso.io lookup, so traffic to
# the current Expanso cluster's NATS (4222) and API (9010) lands on the
# SSH-tunnel listeners. The macOS resolver routes only us2.cloud.expanso.io
# to us (via /etc/resolver/us2.cloud.expanso.io); cloud.expanso.io (the
# web UI) keeps using public DNS so the dashboard still works.

listen-address=127.0.0.1
port=5354
bind-interfaces
no-resolv
no-hosts
no-daemon
log-facility=-

# Wildcard: any subdomain of us2.cloud.expanso.io resolves to localhost.
# New cluster spun up in Expanso Cloud => automatically handled.
address=/us2.cloud.expanso.io/127.0.0.1
