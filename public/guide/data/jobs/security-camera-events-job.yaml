# Box counting, step 2: validate and enrich the detection scans.
#
# Follows detection-events.ndjson (written by yolo-detector) with
# scripts/tail-ndjson.py and a checkpoint, drops scans that do not carry a
# schema_version, and stamps source and lineage. Pure Bloblang after the
# follower: no Python in the data path.
#
# Settings come from the node's environment:
#   EDGE_ISR_HOME  checkout of this repository   (default /opt/edge-isr/app)
#   BOX_DATA_DIR   where the scans are written   (default /opt/box-monitor)
#   DEVICE_ID, SITE_ID, EDGE_NODE_ID  stamped on every record
#
# Deploy: expanso-cli job deploy jobs/security-camera-events-job.yaml

name: security-camera-events
type: pipeline

selector:
  match_labels:
    role: box-detector

config:
  input:
    subprocess:
      name: /usr/bin/env
      args:
        - python3
        - ${EDGE_ISR_HOME:/opt/edge-isr/app}/scripts/tail-ndjson.py
        - ${BOX_DATA_DIR:/opt/box-monitor}/detection-events.ndjson
        - --checkpoint
        - ${BOX_DATA_DIR:/opt/box-monitor}/security-camera-events.offset
      codec: lines
      restart_on_exit: true
      max_buffer: 1048576
  pipeline:
    threads: 1
    processors:
      - label: parse-scan
        mapping: root = content().string().parse_json().catch(deleted())
      - label: require-schema
        mapping: |
          root = if this.schema_version == null { deleted() } else { this }
      - label: add-source
        mapping: |
          root = this
          root.source = {
            "device_id": "${DEVICE_ID:recomputer-j3011-001}",
            "site_id": "${SITE_ID:warehouse-demo}",
            "pipeline": "security-camera-events",
            "pipeline_version": "2.0.0"
          }
      - label: add-lineage
        mapping: |
          root = this
          root.lineage = {
            "edge_node": "${EDGE_NODE_ID:edge-node}",
            "pipeline": "security-camera-events"
          }
      - label: log-scan
        log:
          level: INFO
          message: enriched scan
          fields_mapping: |
            root.outside = this.detections."cam-outside".boxes
            root.inside = this.detections."cam-inside".boxes
  output:
    label: enriched-outputs
    broker:
      pattern: fan_out
      outputs:
        - label: enriched-file
          file:
            path: ${BOX_DATA_DIR:/opt/box-monitor}/enriched-events.ndjson
            codec: lines
          processors:
            - label: stamp-ingested-at
              mapping: |
                root = this
                root.lineage.ingested_at = now().ts_format("2006-01-02T15:04:05.000Z")
        - label: enriched-stdout
          stdout:
            codec: lines
