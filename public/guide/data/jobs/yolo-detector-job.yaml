# Box counting, step 1: GPU detection loop on a Jetson.
#
# Runs scripts/detect_loop.py inside the pinned Ultralytics Jetson image with
# the NVIDIA runtime. Every scan prints one `detection_scan` JSON line on stdout
# (per-camera box counts); snapshots and detections.json go to the data
# directory for the dashboard. The processors parse each scan and stamp where it
# came from, and the result is appended to detection-events.ndjson, which the
# security-camera-events job reads next.
#
# Settings come from the node's environment:
#   BOX_DATA_DIR  holds .env (camera credentials), the weights and the output
#                 (default /opt/box-monitor)
#   DEVICE_ID, SITE_ID  stamped on every scan
#
# The camera credentials live in $BOX_DATA_DIR/.env (CAM_USER, CAM_PASS_OUTSIDE,
# CAM_PASS_INSIDE, CAM_IP_OUTSIDE, CAM_IP_INSIDE) and never in this file.
# Put box-detector-finetuned.pt or yolov8s-worldv2.pt beside it.
#
# Deploy: expanso-cli job deploy jobs/yolo-detector-job.yaml

name: yolo-detector
type: pipeline

selector:
  match_labels:
    role: box-detector

config:
  input:
    subprocess:
      name: /usr/bin/docker
      args:
        - run
        - --rm
        - --runtime=nvidia
        - --security-opt=no-new-privileges
        - -v
        - ${BOX_DATA_DIR:/opt/box-monitor}:/data
        - -v
        - ${EDGE_ISR_HOME:/opt/edge-isr/app}/scripts:/data/scripts:ro
        - -w
        - /data
        - ultralytics/ultralytics:8.4.173-jetson-jetpack6@sha256:2d24504f89fff14ed466f159508ab476fc93bc11e411874d39df192be97ee0b1
        - python3
        - /data/scripts/detect_loop.py
      codec: lines
      restart_on_exit: true

  pipeline:
    threads: 1
    processors:
      - label: parse-scan
        mapping: root = content().string().parse_json().catch(deleted())

      - label: add-source
        mapping: |
          root = this
          root.source = {
            "device_id": "${DEVICE_ID:recomputer-j3011-001}",
            "site_id": "${SITE_ID:warehouse-demo}",
            "pipeline": "yolo-detector",
            "pipeline_version": "2.0.0"
          }

      - label: log-scan
        log:
          level: INFO
          message: detection scan
          fields_mapping: |
            root.outside = this.detections."cam-outside".boxes
            root.inside = this.detections."cam-inside".boxes

  output:
    broker:
      pattern: fan_out
      outputs:
        - label: scans-file
          file:
            path: ${BOX_DATA_DIR:/opt/box-monitor}/detection-events.ndjson
            codec: lines
          processors:
            - label: stamp-detected-at
              mapping: |
                root = this
                root.detected_at = now().ts_format("2006-01-02T15:04:05.000Z")

        - label: scans-stdout
          stdout:
            codec: lines
