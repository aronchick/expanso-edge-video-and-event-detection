# Edge-ISR sensor — sector north (cam-outside, 192.168.2.10).
# Runs the YOLO+Gemini cascade as a real Expanso pipeline on the Jetson,
# replacing the standalone nohup edge-sensor process.
#
# Why a pipeline, not Type: ops with docker: the current Expanso CLI
# accepts only Type: pipeline. We wrap edge-sensor as a subprocess input
# with restart_on_exit so the agent supervises restarts. Output is
# `drop`: the sensor's real output is HTTP POSTs to fusion-node (events)
# plus snapshot JPEGs on disk; nothing on stdout we want to ship.
#
# === DECLARATIVE EXECUTION ===
# We invoke the entry point through `/usr/bin/env`, which lets us declare
# env vars + the actual command in one args list — no shell wrapper, no
# stale .venv/bin/<name> path baked into the YAML. uv resolves the venv
# from pyproject.toml on each start, so a venv rebuild "just works."
#
# Env vars set inline (per-job, no agent-wide leakage):
#   LD_LIBRARY_PATH      — system cuBLAS 12.6 first (Orin needs this; the
#                          wheel cuBLAS 12.9 fails CUBLAS_STATUS_ALLOC),
#                          then nvidia/cu12 dir for libcudss.so.0.
#   EDGE_INFERENCE_FPS_CAP — caps YOLO inference rate; raise for fluidity,
#                          lower if dashboard/Mac is choking.
#
# Env vars that MUST be in the agent's environment (expanso-edge.service):
#   CAM_USER, CAM_PASS_OUTSIDE  — RTSP basic auth
#   GOOGLE_API_KEY              — Gemini Flash for second-stage cascade
#                                 (without it, every event reads "[cached]")
#
# RTSP: sub-stream (640×360 H.264) — the main stream is HEVC + 4K which
# (a) saturates Jetson decode under both cameras, (b) costs more YOLO time.
#
# Deploy:
#   expanso-cli profile select armyx-tech   # or whichever profile
#   expanso-cli job deploy jobs/sensor-north-job.yaml
#   expanso-cli job start sensor-north

name: sensor-north
type: pipeline

config:
  input:
    subprocess:
      name: /usr/bin/env
      args:
        # Inline env: LD_LIBRARY_PATH puts system cuBLAS 12.6 ahead of the
        # nvidia/cu12 wheel's cuBLAS 12.9 (which crashes Orin), and exposes
        # libcudss.so.0 from the wheel for torch._C.
        - LD_LIBRARY_PATH=/usr/local/cuda/lib64:/home/daaronch/security-cameras/.venv/lib/python3.10/site-packages/nvidia/cu12/lib
        - EDGE_INFERENCE_FPS_CAP=10
        # Declarative entry — uv run resolves the venv from pyproject.toml
        # and dispatches to the `edge-sensor` console script. No hard-coded
        # /home/.../venv/bin/edge-sensor path; survives venv rebuild.
        - /home/daaronch/.local/bin/uv
        - run
        - --project
        - /home/daaronch/security-cameras
        - edge-sensor
        - --orchestrator=http://localhost:8090
        - --node-id=sensor-north
        - --rtsp-url=rtsp://${CAM_USER}:${CAM_PASS_OUTSIDE}@192.168.2.10:554/h264Preview_01_sub
        - --yolo-model=/home/daaronch/security-cameras/drone-3class-v2.pt
        - --db=/opt/edge-isr/data/sensor-north.db
      codec: lines
      restart_on_exit: true
      max_buffer: 1048576

  pipeline:
    # No-op processor: subprocess emits plain-text stdout lines like
    # "[sensor-north] emitted: ['person']", not JSON. `mapping: root = this`
    # tries to access the message as a JSON value and floods the agent log
    # with "unable to reference message as structured" at ~30/sec, marking
    # the job degraded. Since output is drop:{}, we just need anything that
    # doesn't error — `root = content().string()` keeps the raw bytes as a
    # string and is a true no-op.
    processors:
      - mapping: root = content().string()

  output:
    drop: {}
