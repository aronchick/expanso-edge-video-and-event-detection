# Edge-ISR sensor — sector north.
# Per HACKATHON_SCRIPT.md §11. Runs the YOLO+Gemini cascade as a long-lived
# Expanso job on the Jetson. Identical to sensor-south except NODE_ID,
# RTSP_URL, and DB_PATH.
#
# Required host env at deploy time:
#   REOLINK_USER, REOLINK_PASS_NORTH, GOOGLE_API_KEY
#
# Deploy:
#   expanso-cli job deploy jobs/sensor-north-job.yaml

Name: sensor-north
Type: ops
Constraints:
  - Key: node_type
    Operator: "="
    Values: ["jetson"]

Tasks:
  - Name: detector
    Engine:
      Type: docker
      Params:
        Image: ghcr.io/aronchick/edge-isr-sensor:demo
        EnvironmentVariables:
          - "NODE_ID=sensor-north"
          - "RTSP_URL=rtsp://${REOLINK_USER}:${REOLINK_PASS_NORTH}@192.168.50.11:554/h264Preview_01_sub"
          - "YOLO_MODEL=/models/yolo11s.engine"
          - "ORCHESTRATOR_URL=http://192.168.50.30:8080"
          - "GOOGLE_API_KEY=${GOOGLE_API_KEY}"
          - "DB_PATH=/data/sensor-north.db"
        Devices:
          - PathOnHost: /dev/nvhost-gpu
            PathInContainer: /dev/nvhost-gpu
            CgroupPermissions: rwm
        Volumes:
          - Source: /opt/edge-isr/data
            Target: /data
            ReadOnly: false
          - Source: /opt/edge-isr/models
            Target: /models
            ReadOnly: true

    Network:
      Type: HTTP
      Domains:
        - "generativelanguage.googleapis.com"
        - "192.168.50.30"

    Resources:
      GPU: "1"
