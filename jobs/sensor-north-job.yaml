# Edge-ISR sensor — sector north.
# Real YOLO inference on Anker C310 #1 (via local go2rtc RTSP). Deployed
# as an Expanso pipeline so the cluster control plane can start/stop
# detection from Expanso Cloud — that's the "Cloud turns on the detector"
# step of the demo narrative.
#
# === SELECTOR ===
# `site: laptop-demo` pins this job to the laptop node bootstrapped by
# `just up` (labels in scripts/expanso-edge-labels.yaml). When the same
# logical sensor needs to run on the on-stage Jetson, deploy a separate
# variant with `site: roadshow-demo` and Jetson paths — same job name
# would collide, so use `name: sensor-north-jetson` or similar.
#
# === DECLARATIVE EXECUTION ===
# Python package pulled from GitHub at a pinned SHA via `uv run --from
# git+...`. Bumping requires a deliberate YAML edit; the deploy IS the
# release. First start after a SHA bump is slow (uv git-clone + resolve
# + build); subsequent restarts hit uv's cache and are <5s.
#
# Model weight (drone-3class-v2.pt) is NOT in the package — it lives on
# disk at /Users/daaronch/. Threshold tuning for this specific weight
# file is in detector.py PER_CLASS_THRESHOLDS (commit 3da700b).

name: sensor-north
type: pipeline

selector:
  match_labels:
    site: laptop-demo

config:
  input:
    subprocess:
      # `env` looks up `uv` in PATH instead of pinning a host-specific
      # path like /home/daaronch/.local/bin/uv. Whichever host runs this
      # job (Mac via Homebrew, Linux via .local/bin) finds its own uv.
      name: /usr/bin/env
      args:
        - uv
        - run
        # `uv run --from git+...` requires uv >= 0.5; the Mac currently
        # has 0.8.4 which only knows `--project`. Pointing at the local
        # repo checkout is simpler anyway — the venv there already has
        # the package + deps installed. (When uv on this box gets newer,
        # this can flip back to `--from git+...@SHA` for true reproducibility.)
        - --project
        - /Users/daaronch/code/second-brain/projects/demos/demo-drone-detection
        - edge-sensor
        - --node-id=sensor-north
        - --orchestrator=http://localhost:8080
        - --rtsp-url=rtsp://localhost:8554/cam-outside
        - --yolo-model=/Users/daaronch/drone-3class-v2.pt
        - --db=/Users/daaronch/code/second-brain/projects/demos/demo-drone-detection/.demo-state/sensor-north.db
      codec: lines
      restart_on_exit: true
      max_buffer: 1048576

  pipeline:
    # No-op processor: subprocess emits plain-text stdout lines like
    # "[sensor-north] yolo: person ...". `mapping: root = this` would
    # try to parse them as JSON and flood the agent log with errors.
    # `root = content().string()` keeps the raw bytes and is a true no-op.
    processors:
      - mapping: root = content().string()

  output:
    drop: {}
