# Edge-ISR sensor — sector north (cam-outside, 192.168.2.10).
# Per HACKATHON_SCRIPT.md §11. Runs the YOLO+Gemini cascade as a real
# Expanso pipeline on the Jetson, replacing the standalone nohup
# edge-sensor process.
#
# Why a pipeline, not Type: ops with docker: the current Expanso CLI
# accepts only Type: pipeline. We wrap edge-sensor as a subprocess input
# with restart_on_exit so the agent supervises restarts. Output is
# `drop`: the sensor's real output is HTTP POSTs to fusion-node (events)
# plus snapshot JPEGs on disk; nothing on stdout we want to ship.
#
# === RUNTIME REQUIREMENTS ===
# The expanso-edge agent must have these env vars present (currently in
# /home/daaronch/demo-gemma-4/.env, loaded by expanso-edge.service):
#   CAM_USER, CAM_PASS_OUTSIDE   — RTSP basic auth
#   GOOGLE_API_KEY               — Gemini Flash for the second-stage cascade
#                                  (NOT yet in agent .env; add before deploy)
#
# The fusion-node pipeline must already be running on port 8090 so this
# sensor has somewhere to POST events.
#
# Deploy:
#   expanso-cli profile select armyx-tech
#   expanso-cli job deploy jobs/sensor-north-job.yaml

name: sensor-north
type: pipeline

config:
  input:
    subprocess:
      name: /home/daaronch/security-cameras/.venv/bin/edge-sensor
      args:
        - --orchestrator=http://localhost:8090
        - --node-id=sensor-north
        - --rtsp-url=rtsp://${CAM_USER}:${CAM_PASS_OUTSIDE}@192.168.2.10:554/h264Preview_01_main
        - --yolo-model=yolov8s.pt
        - --db=/opt/edge-isr/data/sensor-north.db
      codec: lines
      restart_on_exit: true
      max_buffer: 1048576

  pipeline:
    processors:
      - mapping: root = this

  output:
    drop: {}
