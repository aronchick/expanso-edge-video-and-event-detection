# Edge-ISR fusion node running as an Expanso job on the laptop.
#
# Naming note: this is the LOCAL FastAPI process — event store,
# cross-sensor correlator, WebSocket, and dashboard backend. It is
# NOT the cluster orchestrator. The cluster orchestrator is Expanso
# Cloud (cloud.expanso.io). Calling this thing "fusion node" instead
# of "orchestrator" matches the term-of-art used in the rest of the
# Expanso platform and keeps the demo script's vocabulary unambiguous.
#
# Per DEMO_UI_SPEC.md §3.1. Listed alongside sensor-north, sensor-south,
# and armyx-tech-event-archive on `expanso-cli job list` so all four
# demo jobs share one control plane (Expanso Cloud).
#
# Deploy:
#   expanso-cli job deploy jobs/fusion-node-job.yaml

Name: fusion-node
Type: ops
Constraints:
  - Key: node_role
    Operator: "="
    Values: ["laptop"]

Tasks:
  - Name: fusion-node
    Engine:
      Type: docker
      Params:
        Image: ghcr.io/aronchick/edge-isr-sensor:demo
        EnvironmentVariables:
          - "PYTHONUNBUFFERED=1"
        Entrypoint:
          - "edge-orchestrator"   # the CLI binary name stays for backwards compat
        Args:
          - "--host=0.0.0.0"
          - "--port=8080"
          - "--db=/data/orchestrator.db"
          - "--triggers=/data/triggers.yaml"
          - "--snapshots=/data/snapshots"
        Volumes:
          - Source: /opt/edge-isr/orchestrator
            Target: /data
            ReadOnly: false
        Ports:
          - HostPort: 8080
            ContainerPort: 8080

    Network:
      Type: HTTP
      Domains:
        # Fusion node only accepts inbound from the demo subnet.
        - "192.168.50.0/24"
