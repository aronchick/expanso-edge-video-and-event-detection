# Edge-ISR fusion node, deployed as a real Expanso pipeline (replaces
# the standalone nohup edge-orchestrator process on the Jetson).
#
# Why a pipeline, not Type: ops with a docker engine: the current Expanso
# CLI accepts only Type: pipeline. We wrap the long-running edge-orchestrator
# FastAPI process as a subprocess input. restart_on_exit keeps it alive
# across crashes; output: drop because the process publishes nothing useful
# on stdout — its real outputs are HTTP (port 8090, dashboard + sensor
# ingest) and the events.ndjson tail consumed by the event-archive pipeline.
#
# Selector is empty: there is exactly one node attached to the armyx-tech
# cluster (security-camera-overseer / Jetson), so it always lands there.
#
# === DECLARATIVE EXECUTION ===
# The Python package is pulled from GitHub at a pinned SHA via `uv run
# --from git+...`, so the deploy and the code are the same thing — bumping
# requires a deliberate YAML edit, no local checkout drift on the Jetson.
# To bump: push the desired commit to main, change the SHA below, redeploy.
#
# The orchestrator is pure-CPU FastAPI (no CUDA env vars). First start
# after a SHA bump is slow (~1–3 min to git-clone + resolve deps + build);
# subsequent restarts hit uv's cache.
#
# === BEFORE FIRST DEPLOY ===
# The Jetson must be prepped:
#   1. Free port 8090: `pkill -f edge-orchestrator` (do this just before
#      `expanso-cli job deploy` so Expanso can bind immediately).
#   2. The orchestrator writes events.ndjson + orchestrator.db + snapshots/
#      relative to its CWD. Expanso edge runs the subprocess from its own
#      working dir; pass absolute paths so output ends up where the archive
#      pipeline expects (/opt/edge-isr/orchestrator/events.ndjson). Create
#      that dir first:
#         sudo mkdir -p /opt/edge-isr/{orchestrator/snapshots,archive}
#         sudo chown -R daaronch:daaronch /opt/edge-isr
#   3. .env in /home/daaronch/security-cameras/.env still drives
#      ARMYX_S3_BUCKET / AWS_PROFILE / JETSON_HOST (load_dotenv walks CWD).
#      uv will run the subprocess from its install dir, not the repo dir,
#      so we inject those vars inline below for resilience.
#
# Deploy:
#   expanso-cli profile select armyx-tech
#   expanso-cli job deploy jobs/orchestrator-job.yaml
#   expanso-cli job start fusion-node

name: fusion-node
type: pipeline

config:
  input:
    subprocess:
      name: /usr/bin/env
      args:
        # S3 archive bucket — orchestrator's S3Watcher uses this to poll
        # the bucket and surface object counts on the dashboard's
        # ARCHIVE tab. The agent .env currently lacks ARMYX_S3_BUCKET,
        # so we inject it inline here instead of editing the .env file
        # (which would force a full agent restart).
        - ARMYX_S3_BUCKET=armyx-tech-edge-events-767397752906
        - AWS_PROFILE=armyx-tech
        - /home/daaronch/.local/bin/uv
        - run
        # Pulled from GitHub at a pinned SHA. To bump, push to main and
        # update the @<sha> ref below — that single edit IS the release.
        - --from
        - git+https://github.com/aronchick/expanso-edge-video-and-event-detection@68aff7b2838c1f88b41ccf313ea3426b14a49a37
        - edge-orchestrator
        - --host=0.0.0.0
        - --port=8090
        - --db=/opt/edge-isr/orchestrator/orchestrator.db
        - --triggers=/opt/edge-isr/orchestrator/triggers.yaml
        - --snapshots=/opt/edge-isr/orchestrator/snapshots
        - --ndjson=/opt/edge-isr/orchestrator/events.ndjson
      codec: lines
      restart_on_exit: true
      max_buffer: 1048576

  pipeline:
    # uvicorn access lines aren't JSON; pass through as raw string.
    # `mapping: root = this` would error trying to parse them as JSON.
    processors:
      - mapping: root = content().string()

  output:
    drop: {}
