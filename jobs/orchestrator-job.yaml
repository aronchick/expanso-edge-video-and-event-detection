# Edge ISR fusion node: the people-count merge and the dashboard backend.
#
# The input is the orchestrator process itself. It prints one JSON line per
# accepted sensor event (the merged tally, per zone and combined) and one per
# crowd alert; uvicorn and error logs stay on stderr. The processors label
# each line CLEAR, FLAG or ALERT and stamp lineage, so the Expanso Cloud
# Monitoring page shows the real alert and tally stream.
#
# The merge itself lives in src/expanso_security_camera/orchestrator/zones.py:
# the FLAG trips when the combined total reaches EDGE_CROWD_THRESHOLD (default
# 3) and every zone has at least one person and the busiest has at least two.
#
# Settings come from the node's environment:
#   EDGE_ISR_HOME        checkout of this repository   (default /opt/edge-isr/app)
#   EDGE_ISR_STATE       database, event log, frames   (default /opt/edge-isr/state)
#   EDGE_ISR_BIND        listen address                (default 127.0.0.1; use
#                        0.0.0.0 only on an isolated LAN, the API has no login)
#   EDGE_ISR_PORT        listen port                   (default 8080)
#   EDGE_ISR_S3_BUCKET   archive bucket the ARCHIVE view reads (optional)
#   EDGE_CROWD_THRESHOLD combined people needed to flag (default 3)
#
# Deploy: expanso-cli job deploy jobs/orchestrator-job.yaml

name: fusion-node
type: pipeline

config:
  input:
    subprocess:
      name: /usr/bin/env
      args:
        - EDGE_CROWD_THRESHOLD=${EDGE_CROWD_THRESHOLD:3}
        - uv
        - run
        - --project
        - ${EDGE_ISR_HOME:/opt/edge-isr/app}
        - edge-orchestrator
        - --host=${EDGE_ISR_BIND:127.0.0.1}
        - --port=${EDGE_ISR_PORT:8080}
        - --db=${EDGE_ISR_STATE:/opt/edge-isr/state}/orchestrator.db
        - --triggers=${EDGE_ISR_STATE:/opt/edge-isr/state}/triggers.yaml
        - --snapshots=${EDGE_ISR_STATE:/opt/edge-isr/state}/snapshots
        - --ndjson=${EDGE_ISR_STATE:/opt/edge-isr/state}/events.ndjson
        - --s3-bucket=${EDGE_ISR_S3_BUCKET:}
      codec: lines
      restart_on_exit: true
      max_buffer: 1048576

  pipeline:
    threads: 1
    processors:
      - label: parse-line
        mapping: root = content().string().parse_json().catch(deleted())

      - label: classify
        mapping: |
          root = this
          root.state = if this.type == "alert" {
            "ALERT"
          } else if this.over == true {
            "FLAG"
          } else {
            "CLEAR"
          }

      - label: add-lineage
        mapping: |
          root = this
          root.lineage = {
            "pipeline": "fusion-node",
            "pipeline_version": "2.0.0",
            "edge_node": "${EDGE_ISR_NODE:edge-node}"
          }

      - label: log-line
        log:
          level: INFO
          message: fusion line
          fields_mapping: |
            root.state = this.state
            root.total = this.total
            root.threshold = this.threshold

  output:
    broker:
      pattern: fan_out
      outputs:
        - label: tally-file
          file:
            path: ${EDGE_ISR_STATE:/opt/edge-isr/state}/tally.ndjson
            codec: lines

        - label: alerts-file
          file:
            path: ${EDGE_ISR_STATE:/opt/edge-isr/state}/alerts.ndjson
            codec: lines
          processors:
            - mapping: |
                root = if this.state == "ALERT" { this } else { deleted() }
