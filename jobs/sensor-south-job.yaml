# Edge-ISR sensor — sector south (cam-inside, 192.168.2.11).
# See sensor-north-job.yaml for context; this is identical except NODE_ID,
# RTSP camera IP/password env, and DB path.
#
# Deploy:
#   expanso-cli profile select armyx-tech
#   expanso-cli job deploy jobs/sensor-south-job.yaml

name: sensor-south
type: pipeline

config:
  input:
    subprocess:
      name: /home/daaronch/security-cameras/.venv/bin/edge-sensor
      args:
        - --orchestrator=http://localhost:8090
        - --node-id=sensor-south
        - --rtsp-url=rtsp://${CAM_USER}:${CAM_PASS_INSIDE}@192.168.2.11:554/h264Preview_01_main
        - --yolo-model=yolov8s.pt
        - --db=/opt/edge-isr/data/sensor-south.db
      codec: lines
      restart_on_exit: true
      max_buffer: 1048576

  pipeline:
    processors:
      - mapping: root = this

  output:
    drop: {}
