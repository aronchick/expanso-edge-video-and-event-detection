# Job: Event Enrichment Pipeline (Pure Bloblang)
# Reads detection events from the YOLO pipeline output,
# enriches with metadata, maps classes, adds lineage,
# routes to archive + upstream.
#
# No subprocess, no Docker, no Python — runs entirely
# inside Expanso Edge as native Bloblang processing.
#
# Deploy:
#   expanso-cli job deploy jobs/security-camera-events-job.yaml

name: security-camera-events
type: pipeline

config:
  input:
    file:
      paths:
        - /home/daaronch/security-cameras/detection-events.ndjson
      codec: lines
      scanner:
        lines: {}

  pipeline:
    processors:
      # Parse JSON — drop non-JSON
      - mapping: root = this.parse_json().catch(deleted())

      # Validate schema
      - mapping: |
          root = if this.schema_version == null {
            deleted()
          } else {
            this
          }

      # Metadata enrichment
      - mapping: |
          root = this
          root.source = {
            "device_id": env("DEVICE_ID").or("recomputer-j3011-001"),
            "site_id": env("SITE_ID").or("warehouse-demo"),
            "pipeline": "security-camera-events",
            "pipeline_version": "1.0.0"
          }
          root.enriched_at = now()

      # Lineage tracking
      - mapping: |
          root = this
          root.lineage = {
            "edge_node": env("EDGE_NODE_ID").or(env("HOSTNAME")).or("unknown"),
            "pipeline": "security-camera-events",
            "ingested_at": now().ts_format("2006-01-02T15:04:05.000Z")
          }

  output:
    broker:
      pattern: fan_out
      outputs:
        - file:
            path: /home/daaronch/security-cameras/enriched-events.ndjson
            codec: lines
        - stdout:
            codec: lines
