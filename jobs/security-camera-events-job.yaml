# Job: Security Camera Box Counting Pipeline
# Runs the versioned inference package (expanso-security-camera) as a
# subprocess. Expanso manages the lifecycle, restarts on failure.
#
# The inference engine is a pip package installed via uv:
#   pyproject.toml defines expanso-security-camera==0.1.0
#   Entry point: esc-infer (runs RTSP → YOLO-World → crossing events)
#
# Deploy:
#   expanso-cli job deploy jobs/security-camera-events-job.yaml

name: security-camera-events
type: pipeline

config:
  input:
    subprocess:
      name: /home/daaronch/.local/bin/uv
      args:
        - --directory
        - /home/daaronch/security-cameras
        - run
        - --quiet
        - esc-infer
        - config.yaml
      codec: lines
      restart_on_exit: true

  pipeline:
    processors:
      # Parse JSON — drop any line that isn't valid JSON
      # (inference writes log/banner text to stderr, but some
      # may leak through; this silently drops non-JSON lines)
      - mapping: |
          root = this.parse_json().catch(deleted())

      # Schema validation — drop events without schema_version
      - mapping: |
          root = if this.schema_version == null {
            deleted()
          } else {
            this
          }

      # Metadata enrichment
      - mapping: |
          root = this
          root.source = {
            "device_id": env("DEVICE_ID").or("recomputer-j3011-001"),
            "site_id": env("SITE_ID").or("warehouse-demo"),
            "camera_id": this.camera_id.or("unknown"),
            "pipeline_version": "1.0.0"
          }
          root.enriched_at = now()

      # Class name mapping — normalize detection labels
      - mapping: |
          let raw_class = this.detection.object_class_raw.or("")
          let mapped = match $raw_class {
            "suitcase" => "box",
            "backpack" => "box",
            "handbag" => "box",
            "cardboard box" => "box",
            "shipping box" => "box",
            "package" => "box",
            "person" => "person",
            _ => "object"
          }
          root = this
          root.detection.object_class = if this.detection != null { $mapped } else { "" }

      # Lineage tracking
      - mapping: |
          root = this
          root.lineage = {
            "edge_node": env("EDGE_NODE_ID").or(env("HOSTNAME")).or("unknown"),
            "pipeline": "security-camera-events",
            "ingested_at": now().ts_format("2006-01-02T15:04:05.000Z")
          }

  output:
    broker:
      pattern: fan_out
      outputs:
        - file:
            path: "/home/daaronch/security-cameras/enriched-events.ndjson"
            codec: lines

        - stdout:
            codec: lines
